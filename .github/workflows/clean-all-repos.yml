# .github/workflows/cleanup-simple.yml
name: 自动清理工作流
on:
  # 凌晨2点自动执行
  schedule:
    - cron: '0 2 * * 0'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      keep_minimum:
        description: '每个工作流保留的记录数'
        required: false
        default: '5'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean repositories one by one
        env:
          KEEP_MINIMUM: ${{ github.event.inputs.keep_minimum || '5' }}
        run: |
          # 安装必要的工具
          sudo apt-get update
          sudo apt-get install -y jq curl
          
          echo "开始清理工作流记录..."
          echo "每个工作流保留 $KEEP_MINIMUM 条记录"
          echo ""
          
          # 获取所有仓库
          page=1
          processed=0
          
          while true; do
            echo "获取第 $page 页仓库..."
            
            # 使用 API 获取仓库列表
            response=$(curl -s -H "Authorization: token ${{ secrets.OTHER_REPO_TOKEN }}" \
              "https://api.github.com/user/repos?per_page=100&page=$page&sort=updated")
            
            repos=$(echo "$response" | jq -r '.[].full_name')
            
            if [ -z "$repos" ] || [ "$repos" = "null" ]; then
              echo "没有更多仓库了"
              break
            fi
            
            # 处理每个仓库
            while IFS= read -r repo; do
              processed=$((processed + 1))
              echo "========================================"
              echo "[$processed] 清理仓库: $repo"
              
              # 使用 curl 调用 delete-workflow-runs 的逻辑
              # 获取工作流列表
              workflows_response=$(curl -s -H "Authorization: token ${{ secrets.OTHER_REPO_TOKEN }}" \
                "https://api.github.com/repos/$repo/actions/workflows")
              
              workflow_ids=$(echo "$workflows_response" | jq -r '.workflows[].id // empty')
              
              if [ -z "$workflow_ids" ]; then
                echo "  该仓库没有工作流或无访问权限"
                continue
              fi
              
              workflow_count=$(echo "$workflow_ids" | wc -l)
              echo "  找到 $workflow_count 个工作流"
              
              # 处理每个工作流
              deleted_total=0
              while IFS= read -r workflow_id; do
                # 获取该工作流的运行记录
                runs_response=$(curl -s -H "Authorization: token ${{ secrets.OTHER_REPO_TOKEN }}" \
                  "https://api.github.com/repos/$repo/actions/workflows/$workflow_id/runs?per_page=100")
                
                # 提取所有运行记录ID（按创建时间排序）
                run_data=$(echo "$runs_response" | jq -c '.workflow_runs | sort_by(.created_at) | reverse')
                run_count=$(echo "$run_data" | jq 'length')
                
                if [ $run_count -le $KEEP_MINIMUM ]; then
                  echo "    工作流 $workflow_id: 只有 $run_count 条记录，无需清理"
                  continue
                fi
                
                echo "    工作流 $workflow_id: $run_count 条记录，保留 $KEEP_MINIMUM 条"
                
                # 获取要删除的记录ID（从第 KEEP_MINIMUM+1 条开始）
                delete_ids=$(echo "$run_data" | jq -r ".[$KEEP_MINIMUM:][] | .id")
                delete_count=$(echo "$delete_ids" | wc -l)
                
                # 删除旧记录
                deleted_in_workflow=0
                while IFS= read -r run_id; do
                  if [ -n "$run_id" ]; then
                    echo "      删除运行记录: $run_id"
                    curl -s -X DELETE -H "Authorization: token ${{ secrets.OTHER_REPO_TOKEN }}" \
                      "https://api.github.com/repos/$repo/actions/runs/$run_id" > /dev/null
                    deleted_in_workflow=$((deleted_in_workflow + 1))
                    deleted_total=$((deleted_total + 1))
                    sleep 0.3  # 避免速率限制
                  fi
                done <<< "$delete_ids"
                
                echo "    删除了 $deleted_in_workflow 条记录"
                
              done <<< "$workflow_ids"
              
              if [ $deleted_total -gt 0 ]; then
                echo "  ✅ 总共删除了 $deleted_total 条记录"
              fi
              
              echo ""
              sleep 1  # 避免速率限制
              
            done <<< "$repos"
            
            page=$((page + 1))
            
            # 最多处理3页（300个仓库），避免超时
            if [ $page -gt 3 ]; then
              echo "已达到最大处理页数限制"
              break
            fi
            
          done
          
          echo "========================================"
          echo "🎉 清理完成!"
          echo "总共处理了 $processed 个仓库"
